<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;background-color:#B91C1C;color:#fff;min-height:100vh;padding:24px 12px 90px;background-image:radial-gradient(circle at 15% 15%,rgba(127,29,29,.8) 0%,transparent 40%),radial-gradient(circle at 85% 85%,rgba(153,27,27,.8) 0%,transparent 40%);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.card{background:rgba(153,27,27,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 32px rgba(0,0,0,.25);border-radius:16px}
.inp,button{font:inherit;color:#fff;-webkit-text-fill-color:#fff}
.inp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);caret-color:#fff;font-size:15px;border-radius:8px;padding:6px 10px;width:100%;min-width:0;outline:none}
.inp:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
.inp::placeholder{color:rgba(255,255,255,.4);-webkit-text-fill-color:rgba(255,255,255,.4)}
button{cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 14px;font-weight:600}
header{padding:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px}
h1{font-size:24px;font-weight:900}
.sub{font-size:13px;color:rgba(255,255,255,.7);direction:ltr;text-align:right}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#status{text-align:center;font-size:13px;color:#fecaca;margin-bottom:12px}#status.warn{color:#fde68a}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
nav a{padding:6px 14px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:13px;font-weight:600}
main{display:flex;flex-direction:column;gap:32px}
section.day{padding:22px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:16px}
.dh{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:12px}
.dh h2{font-size:26px;font-weight:800;display:flex;gap:10px}
.badge{font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mrow label,.lbl{font-size:14px;font-weight:700;white-space:nowrap}
.mrow .inp{max-width:320px}
.tw{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.2)}
table{width:100%;min-width:640px;border-collapse:collapse;text-align:right;font-size:14px}
thead{background:rgba(255,255,255,.1)}
th{padding:10px;border-bottom:1px solid rgba(255,255,255,.2);border-left:1px solid rgba(255,255,255,.2)}
th.c,td .c{text-align:center}
td{padding:6px;border-left:1px solid rgba(255,255,255,.2);border-top:1px solid rgba(255,255,255,.1)}
td.n,th.n{text-align:center;width:34px;color:rgba(255,255,255,.7);font-size:12px}
.dx{padding:4px 9px;color:#ffb4b4;-webkit-text-fill-color:#ffb4b4;border-color:rgba(255,150,150,.5);border-radius:8px}
.add{width:100%;margin-top:8px;border-style:dashed}
.foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}
textarea{resize:vertical;padding:10px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;background:#0b0d14;border:1px solid #fff;border-radius:14px;padding:10px 14px}
#bar[hidden],#sh[hidden]{display:none}
#tl{flex:1;font-size:26px;font-weight:800;direction:ltr;text-align:right}
#sh{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);display:flex;align-items:flex-end}
.pn{width:100%;background:#0b0d14;border-top:2px solid #fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.rd{direction:ltr;text-align:center;font-size:38px;font-weight:800;margin:8px 0 12px}
.sl{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:8px}
input[type=range]{width:100%;height:30px;accent-color:#fff;background:transparent;border:0;padding:0}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0b0d14;border:1px solid #fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:.3s}#toast.on{opacity:1}
@media(max-width:640px){h1{font-size:20px}section.day{padding:14px}.grid{grid-template-columns:1fr}}
#lock{position:fixed;inset:0;z-index:9999;background:#B91C1C;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:#fff}
#lock .box{width:100%;max-width:380px;background:rgba(153,27,27,.85);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:28px 20px;text-align:center}
#lock h2{font-size:22px;margin-bottom:8px;color:#ffffff}
#lock p{font-size:14px;opacity:.85;margin-bottom:18px;line-height:1.7}
#lock input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;-webkit-text-fill-color:#fff;font-size:18px;text-align:center;letter-spacing:2px;direction:ltr;outline:none;text-transform:uppercase}
#lock button{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.2);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
#lockmsg{min-height:22px;margin-top:12px;font-size:13px;color:#ffd7d7}

<script>
var K='gym_red_white_data_v2',DY=[['sat','السبت','⚡'],['sun','الأحد','🔥'],['mon','الاثنين','💪'],['tue','الثلاثاء','🥊'],['wed','الأربعاء','🏆'],['thu','الخميس','🎯'],['fri','الجمعة','🌿']],S,mem=null,lsOk=false,tm,end=0,ctx,tt;
function $(i){return document.getElementById(i)}

function ex(){return{n:'',s:'',r:'',w:'',t:''}}
function mg(){return{n:'',x:[ex(),ex(),ex(),ex()]}}

 else if(a=='am'){S.d[b.dataset.y].m.push(mg());save();render()}
 else if(a=='tm'){$('rm').value=Math.floor(S.rs/60);$('rc').value=S.rs%60;tmu();$('sh').hidden=false}
 else if(a=='go'){var n=$('rm').value*60+ +$('rc').value;if(n>0){S.rs=n;save();$('sh').hidden=true;startT(n)}}
 else if(a=='ts')stopT();
 else if(a=='x')$('sh').hidden=true;
 else if(a=='bk'){var j=JSON.stringify(S);cp(j).then(function(ok){ok?toast('تم نسخ بياناتك، الصقها في ملاحظات هاتفك'):prompt('انسخ هذا النص:',j)})}
 else if(a=='rs'){var t=prompt('الصق النسخة الاحتياطية:');if(t){try{var o=JSON.parse(t);if(!o.d)throw 0;S=o;save();render();toast('تمت الاستعادة')}catch(er){toast('النص غير صالح')}}}
 else if(a=='rm'){if(confirm('هل أنت متأكد من مسح كل البيانات؟')){try{localStorage.removeItem(K)}catch(er){}mem=null;S=fresh();save();render();toast('تم إعادة الضبط')}}});
document.addEventListener('input',function(e){var t=e.target,mb=t.closest('.mb'),f=t.dataset.f;
 if(t.id=='rm'||t.id=='rc'){tmu();return}
 if(f){if(f=='r'||f=='w')fx(t);S.d[mb.dataset.y].m[mb.dataset.m].x[t.closest('tr').dataset.i][f]=t.value}
 else if(t.dataset.mn)S.d[mb.dataset.y].m[mb.dataset.m].n=t.value;
 else if(t.dataset.df)S.d[t.dataset.y][t.dataset.df]=t.value;
 else return;
 save()});
S=ld()||fresh();render();save();
