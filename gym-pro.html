<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYM PRO - جدول التمارين المتقدم</title>
<style>
:root{--bg:#040508;--t:#ffffff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-t=gold]{--a:#D4A017;--g:212,160,23}
[data-t=silver]{--a:#B8C0CC;--g:184,192,204}
[data-t=blue]{--a:#3B7BEA;--g:59,123,234}
[data-t=red]{--a:#DC3545;--g:220,53,69}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;background-color:var(--bg);color:var(--t);min-height:100vh;padding-bottom:100px;background-image:radial-gradient(circle at 12% 0,rgba(var(--g),.16),transparent 45%),radial-gradient(circle at 95% 100%,rgba(var(--g),.09),transparent 42%),linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:auto,auto,26px 26px,26px 26px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,8,12,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(var(--g),.25);padding:10px 12px 8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lg{font-size:20px;color:var(--a);letter-spacing:2px;direction:ltr;display:block}
small{color:#c3c9d3;font-size:12px}
.hb{display:flex;gap:8px}.bd{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;padding:5px;border:1.5px solid var(--a);border-radius:12px;color:var(--a);background:rgba(var(--g),.12)}.qt{padding:12px 14px;margin-bottom:14px;border-radius:12px;border:1px solid rgba(var(--g),.5);background:linear-gradient(90deg,rgba(var(--g),.2),rgba(var(--g),.04));color:#fff;font-weight:700;font-size:15px;text-align:center;line-height:1.7}.mh{display:flex;gap:6px;margin-bottom:8px}.mh .mn{margin-bottom:0;flex:1}
button{font:inherit;color:var(--t);cursor:pointer;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:10px}
.ib2{width:42px;height:42px;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{padding:7px 14px;white-space:nowrap;font-size:14px}
.tab.on{background:rgba(var(--g),.2);border-color:var(--a);color:var(--a);font-weight:700}
main{padding:12px;max-width:760px;margin:0 auto}
section{margin-bottom:18px}
input,textarea{width:100%;min-width:0;padding:9px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;-webkit-text-fill-color:#fff;caret-color:#fff;font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--a)}
.mn{font-weight:700;color:var(--a);-webkit-text-fill-color:var(--a);margin-bottom:8px;border-color:rgba(var(--g),.4)}
.ex{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px;margin-bottom:8px}
.ex.dn{border-color:rgba(var(--g),.65);background:rgba(var(--g),.08)}
.ex.ss{margin-top:-4px;border-top:2px dashed var(--a)}
.r1{display:flex;gap:6px;align-items:center}
.ck{width:34px;height:34px;flex:none;color:var(--a);font-weight:900;border-color:var(--a)}
.ib{width:34px;height:34px;flex:none;padding:0}
.r2{display:grid;grid-template-columns:.75fr 1.7fr 1.35fr .8fr;gap:6px;margin-top:8px}
.r2 label{font-size:12px;color:#c3c9d3;display:flex;flex-direction:column;gap:3px}
.r2 input{text-align:center;padding:9px 4px}
.add,.bt{width:100%;padding:10px;color:var(--a);border-color:rgba(var(--g),.4);background:rgba(var(--g),.08);display:block;text-align:center;margin-top:6px}
.cd{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px}
.cd summary{color:var(--a);font-weight:700;cursor:pointer}
.cd input,.cd textarea{margin-top:8px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;background:#11131a;border:1px solid var(--a);border-radius:14px;padding:10px 14px}
#bar[hidden],#sh[hidden]{display:none}
#tl{flex:1;font-size:26px;font-weight:800;color:var(--a);direction:ltr;text-align:right}
#bar button{padding:8px 14px}
#sh{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);display:flex;align-items:flex-end}
.pn{width:100%;max-height:88vh;overflow:auto;background:#0d0f15;border-top:2px solid var(--a);border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px;color:var(--a)}
.ph button{width:36px;height:36px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:14px 8px;font-size:14px;display:flex;flex-direction:column;gap:4px;align-items:center}
.mi span{font-size:22px}
.lb{margin:14px 0 6px;color:#9aa0aa;font-size:13px}
.sw,.rw{display:flex;gap:10px}
.cl{width:46px;height:46px;border-radius:50%}
.cl.on{outline:3px solid #fff}
.pr,.bl{padding:10px;border:1px solid rgba(255,255,255,.09);border-radius:10px;margin-top:8px;font-size:14px}
.pr b{color:var(--a)}
.bl span{display:inline-block;margin:4px 0 0 10px;font-size:13px}
.bf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.bf label{font-size:11px;color:#9aa0aa}
.nt{margin-top:12px;font-size:12px;color:#9aa0aa}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pg img{width:100%;border-radius:10px}
.pg figcaption{font-size:12px;color:#9aa0aa;display:flex;justify-content:space-between}
details p{margin:6px 0;font-size:13px}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#11131a;border:1px solid var(--a);padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;z-index:99;background:#040508;background-image:radial-gradient(circle at 15% 10%,rgba(212,160,23,.18),transparent 45%),linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:auto,26px 26px,26px 26px;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:#fff}
#lock .box{width:100%;max-width:380px;background:#0d0f15;border:1px solid #D4A017;border-radius:18px;padding:28px 20px;text-align:center}
#lock h2{font-size:22px;margin-bottom:8px;color:#D4A017}
#lock p{font-size:14px;opacity:.9;margin-bottom:18px;line-height:1.7}
#lock input{width:100%;padding:12px;border-radius:10px;border:1px solid #D4A017;background:rgba(255,255,255,.06);color:#fff;-webkit-text-fill-color:#fff;font-size:18px;text-align:center;letter-spacing:2px;direction:ltr;outline:none;text-transform:uppercase}
#lock button{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid #D4A017;background:rgba(212,160,23,.2);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
#lockmsg{min-height:22px;margin-top:12px;font-size:13px;color:#ffb4b4}
</style>
</head>
<body>
<div id="lock"><div class="box"><h2>🔒 أدخل كود التفعيل</h2><p>الكود وصلك مع عملية الشراء. تدخله مرة واحدة فقط على هذا الهاتف.</p><input id="lockinp" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button id="lockbtn" type="button">تفعيل</button><div id="lockmsg"></div></div></div>

<header><div class="hd"><div class="bd"><svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 14h52M8 8v12M56 8v12M16 14l9 22M48 14l-9 22M25 36h14M32 36v12M32 48l-8 14M32 48l8 14"/><circle cx="32" cy="26" r="5" fill="currentColor"/></svg><div><b class="lg">GYM PRO</b><small id="wi"></small></div></div><div class="hb"><button class="ib2" data-a="t">⏱</button><button class="ib2" data-a="menu">☰</button></div></div><nav class="tabs" id="tabs"></nav></header>
<main id="main"></main>
<div id="bar" hidden><span id="tl">0:00</span><button data-a="t15">+15</button><button data-a="ts">إيقاف</button></div>
<div id="sh" hidden><div class="pn"><div class="ph"><b id="st"></b><button data-a="x">✕</button></div><div id="sb"></div></div></div>
<div id="toast"></div>
<script>
var K='gym_pro_v1',PK='gym_pro_ph',D=[['sat','السبت'],['sun','الأحد'],['mon','الاثنين'],['tue','الثلاثاء'],['wed','الأربعاء'],['thu','الخميس'],['fri','الجمعة']],cur=(new Date().getDay()+1)%7,mem=null,tm,end=0,ctx,tt;
var Q=['لا تتوقف عندما تتعب، توقف عندما تنتهي.','كل تكرار يقرّبك من أفضل نسخة منك.','الانضباط يتفوّق على الحماس.','تعب اليوم هو فخر الغد.','جسمك يحقق ما يؤمن به عقلك.','خطوة صغيرة كل يوم تصنع فرقاً كبيراً.','اجعل تمرين اليوم أفضل من أمس.'];
function $(i){return document.getElementById(i)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ex(){return{n:'',s:'',r:'',w:'',t:'',d:0,ss:0}}
function mg(){return{n:'',ex:[ex(),ex(),ex(),ex()]}}
function wk(){var o={start:today(),dl:0,days:{}};D.forEach(function(x){o.days[x[0]]={m:[mg(),mg()],cT:'',cD:'',nt:''}});return o}
function fresh(){return{th:'gold',rs:90,snd:1,wk:wk(),ar:[],body:[]}}
function ld(){var r=null;try{r=localStorage.getItem(K)}catch(e){}try{var o=JSON.parse(r||mem);return o&&o.wk?o:null}catch(e){return null}}
var S=ld()||fresh();
function save(){var j=JSON.stringify(S);try{localStorage.setItem(K,j)}catch(e){mem=j}}
function day(){return S.wk.days[D[cur][0]]}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(function(){t.className=''},2500)}
function num(s){var m=String(s||'').match(/\d+(\.\d+)?/g);return m?Math.max.apply(null,m.map(Number)):0}
function card(e,m,i){return '<div class="ex'+(e.d?' dn':'')+(e.ss?' ss':'')+'" data-m="'+m+'" data-i="'+i+'"><div class="r1"><button class="ck" data-a="done">'+(e.d?'✓':'')+'</button><input data-f="n" placeholder="اسم التمرين" value="'+esc(e.n)+'"><button class="ib" data-a="ss">🔗</button><button class="ib" data-a="del">✕</button></div><div class="r2"><label>جولات<input data-f="s" inputmode="numeric" value="'+esc(e.s)+'"></label><label>العدات<input data-f="r" placeholder="15×12×10" value="'+esc(e.r)+'"></label><label>الوزن<input data-f="w" value="'+esc(e.w)+'"></label><label>راحة<input data-f="t" inputmode="numeric" value="'+esc(e.t)+'"></label></div></div>'}
function render(){
 document.documentElement.dataset.t=S.th;
 $('wi').textContent='أسبوع '+S.wk.start+(S.wk.dl?' • تخفيف':'');
 $('tabs').innerHTML=D.map(function(x,i){return '<button class="tab'+(i==cur?' on':'')+'" data-a="day" data-i="'+i+'">'+x[1]+'</button>'}).join('');
 var d=day();
 $('main').innerHTML='<div class="qt">'+Q[new Date().getDate()%7]+'</div>'+d.m.map(function(g,m){return '<section><div class="mh"><input class="mn" data-mn="'+m+'" placeholder="اسم العضلة" value="'+esc(g.n)+'">'+(d.m.length>1?'<button class="ib" data-a="delm" data-m="'+m+'">✕</button>':'')+'</div>'+g.ex.map(function(e,i){return card(e,m,i)}).join('')+'<button class="add" data-a="add" data-m="'+m+'">+ إضافة تمرين</button></section>'}).join('')+'<button class="add" data-a="addm">+ إضافة عضلة جديدة</button><details class="cd"><summary>🏃 الكارديو والملاحظات</summary><input data-df="cT" placeholder="نوع الكارديو" value="'+esc(d.cT)+'"><input data-df="cD" placeholder="مدة الكارديو" value="'+esc(d.cD)+'"><textarea data-df="nt" rows="3" placeholder="ملاحظات اليوم">'+esc(d.nt)+'</textarea></details>'}
function beep(){if(!S.snd)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.5,1].forEach(function(t,i){var o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+t;o.type='sine';o.frequency.value=i<2?660:880;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.42);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+.45)});if(navigator.vibrate)navigator.vibrate([120,80,120])}catch(e){}}
function startT(sec){if(S.snd){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume()}catch(e){}}end=Date.now()+sec*1000;clearInterval(tm);tm=setInterval(tick,250);$('bar').hidden=false;tick()}
function tick(){var s=Math.ceil((end-Date.now())/1000);if(s<=0){stopT();beep();toast('انتهت الراحة');return}$('tl').textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function stopT(){clearInterval(tm);$('bar').hidden=true}
function sheet(t,h){$('st').textContent=t;$('sb').innerHTML=h;$('sh').hidden=false}
function cp(t){return navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(function(){return 1},function(){return 0}):Promise.resolve(0)}
var MN=[['set','⚙️','الإعدادات والألوان'],['prog','📈','التقدّم'],['body','⚖️','وزن الجسم والقياسات'],['ph','📷','صور التقدّم'],['nw','🗓','أسبوع جديد'],['ar','📚','الأرشيف'],['dl','🏷','أسبوع تخفيف'],['bk','💾','نسخ احتياطي'],['rs','📥','استعادة'],['rm','🗑','مسح كل البيانات']];
function setHtml(){return '<p class="lb">لون التصميم</p><div class="sw">'+[['gold','#D4A017'],['silver','#B8C0CC'],['blue','#3B7BEA'],['red','#DC3545']].map(function(c){return '<button class="cl'+(S.th==c[0]?' on':'')+'" data-a="th" data-v="'+c[0]+'" style="background:'+c[1]+'"></button>'}).join('')+'</div><p class="lb">مدة الراحة الافتراضية (بالثواني)</p><input id="rs" inputmode="numeric" value="'+S.rs+'"><p class="lb">صوت انتهاء الراحة</p><div class="rw"><button class="bt" data-a="snd">'+(S.snd?'مفعّل 🔔':'متوقف 🔕')+'</button><button class="bt" data-a="tst">تجربة</button></div>'}
function prog(){var M={};S.ar.concat([S.wk]).forEach(function(w){if(w.dl)return;D.forEach(function(x){w.days[x[0]].m.forEach(function(g){g.ex.forEach(function(e){var k=e.n.trim(),v=num(e.w);if(k&&v)(M[k]=M[k]||[]).push([v,num(e.r)])})})})});
 var h=Object.keys(M).map(function(k){var a=M[k],f=a[0],l=a[a.length-1],b=Math.max.apply(null,a.map(function(r){return r[0]})),dw=+(l[0]-f[0]).toFixed(1),dr=+(l[1]-f[1]).toFixed(1);return '<div class="pr"><b>'+esc(k)+'</b>'+(a.length>1&&l[0]>=b&&dw>0?' 🏆':'')+'<p>الوزن: '+f[0]+' ← '+l[0]+' ('+(dw>0?'+':'')+dw+')</p><p>العدات: '+f[1]+' ← '+l[1]+' ('+(dr>0?'+':'')+dr+')</p></div>'}).join('');
 return (h||'<p>سجّل أوزان تمارينك في أسابيع مختلفة ليظهر تقدّمك هنا.</p>')+'<p class="nt">أسابيع التخفيف لا تدخل في الحساب.</p>'}
var BF=[['wt','وزن الجسم'],['ws','الخصر'],['ch','الصدر'],['ar','الذراع'],['th','الفخذ']];
function bodyHtml(){var b=S.body;return '<div class="bf">'+BF.map(function(f){return '<label>'+f[1]+'<input id="b_'+f[0]+'" inputmode="decimal"></label>'}).join('')+'</div><button class="bt" data-a="bd">حفظ القياس</button>'+b.slice().reverse().map(function(r,j){var p=b[b.length-2-j];return '<div class="bl"><b>'+r.d+'</b><br>'+BF.map(function(f){if(!r[f[0]])return'';var df=p&&p[f[0]]?+(r[f[0]]-p[f[0]]).toFixed(1):0;return '<span>'+f[1]+' '+r[f[0]]+(df?' ('+(df>0?'+':'')+df+')':'')+'</span>'}).join('')+'</div>'}).join('')}
function PH(){try{return JSON.parse(localStorage.getItem(PK)||'[]')}catch(e){return[]}}
function phHtml(){return '<label class="bt">+ إضافة صورة<input type="file" accept="image/*" id="pf" hidden></label><div class="pg">'+PH().map(function(o,i){return '<figure><img src="'+o.i+'"><figcaption>'+o.d+'<button data-a="pd" data-i="'+i+'">✕</button></figcaption></figure>'}).join('')+'</div>'}
function wsum(w){return D.map(function(x){var l=[];w.days[x[0]].m.forEach(function(g){g.ex.forEach(function(e){if(e.n)l.push(esc(e.n)+' '+esc(e.s)+'×'+esc(e.r)+' @ '+esc(e.w))})});return l.length?'<p><b>'+x[1]+'</b>: '+l.join(' ، ')+'</p>':''}).join('')||'<p>فارغ</p>'}
function csv(){var R=[['الأسبوع','اليوم','العضلة','التمرين','الجولات','العدات','الوزن','الراحة','تم']];S.ar.concat([S.wk]).forEach(function(w){D.forEach(function(x){w.days[x[0]].m.forEach(function(g){g.ex.forEach(function(e){if(e.n)R.push([w.start+(w.dl?' (تخفيف)':''),x[1],g.n,e.n,e.s,e.r,e.w,e.t,e.d?1:0])})})})});
 var t='\ufeff'+R.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 cp(t);try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='gym.csv';a.click()}catch(e){}toast('تم نسخ بيانات CSV')}
function menuAct(k){
 if(k=='set')sheet('⚙️ الإعدادات',setHtml());
 else if(k=='prog')sheet('📈 التقدّم',prog());
 else if(k=='body')sheet('⚖️ القياسات',bodyHtml());
 else if(k=='ph')sheet('📷 صور التقدّم',phHtml());
 else if(k=='ar')sheet('📚 الأرشيف',S.ar.length?S.ar.slice().reverse().map(function(w){return '<details class="pr"><summary>'+w.start+(w.dl?' • تخفيف':'')+'</summary>'+wsum(w)+'</details>'}).join(''):'<p>لا توجد أسابيع محفوظة بعد</p>');
 else if(k=='nw'){if(confirm('سيُحفظ هذا الأسبوع في الأرشيف ويبدأ أسبوع جديد بنفس التمارين. متابعة؟')){S.ar.push(S.wk);var n=JSON.parse(JSON.stringify(S.wk));n.start=today();n.dl=0;D.forEach(function(x){n.days[x[0]].m.forEach(function(g){g.ex.forEach(function(e){e.d=0})})});S.wk=n;save();$('sh').hidden=true;render();toast('بدأ أسبوع جديد')}}
 else if(k=='dl'){S.wk.dl=S.wk.dl?0:1;save();render();$('sh').hidden=true;toast(S.wk.dl?'هذا الأسبوع أسبوع تخفيف':'أُلغي أسبوع التخفيف')}
 
 else if(k=='bk'){var j=JSON.stringify(S);cp(j).then(function(ok){ok?toast('تم نسخ النسخة الاحتياطية، الصقها في ملاحظاتك'):prompt('انسخ هذا النص:',j)})}
